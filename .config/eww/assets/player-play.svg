<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Collapsed player, "paused/stopped" state: concentric outline
       circles with an outlined play triangle. Drawn as SVG rather than
       a GTK-CSS border-radius button, which renders as a rounded
       rectangle and cannot express the inner ring or an outlined
       (rather than font-glyph) triangle at all. -->
  <g fill="none" stroke="#25d366" stroke-width="1.6">
    <circle cx="32" cy="32" r="29"/>
    <circle cx="32" cy="32" r="23"/>
    <path d="M27 21 L46 32 L27 43 Z" stroke-linejoin="round"/>
  </g>
</svg>
