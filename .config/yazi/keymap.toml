# keymap.toml — yazi 26.x. Section is [mgr]; `[manager]` was renamed in 25.5.31.
# `prepend_keymap` wins over the built-in defaults.

# ── navigation / UX ──────────────────────────────────────────────────────────
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "f"
run  = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# ── file operations ──────────────────────────────────────────────────────────
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory, or CWD"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount manager"

[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

[[mgr.prepend_keymap]]
on   = "C"
run  = "plugin ouch"
desc = "Compress with ouch"

# ── integrations ─────────────────────────────────────────────────────────────
[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "Open lazygit"

# glow.yazi: scroll the rendered markdown preview
[[mgr.prepend_keymap]]
on   = "<C-e>"
run  = "seek 5"
desc = "Scroll preview down"

[[mgr.prepend_keymap]]
on   = "<C-y>"
run  = "seek -5"
desc = "Scroll preview up"

# ── static jumps ────────────────────────────────────────────────────────────
# `g` is yazi's built-in "go to" prefix -- `g h` (home), `g c` (~/.config),
# `g g` (top) and `g <Space>` (interactive) still work. `g d` below REPLACES
# the default `g d` -> ~/Downloads.
[[mgr.prepend_keymap]]
on   = [ "g", "." ]
run  = "cd ~/dotfiles"
desc = "Go to ~/dotfiles"

[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = "cd ~/workspace"
desc = "Go to ~/workspace"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/workspace/projects"
desc = "Go to ~/workspace/projects"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/workspace/scripts"
desc = "Go to ~/workspace/scripts"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Documents/Docs"
desc = "Go to ~/Documents/Docs"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd ~/Music"
desc = "Go to ~/Music"

[[mgr.prepend_keymap]]
on   = [ "g", "P" ]
run  = "cd ~/Pictures"
desc = "Go to ~/Pictures"
