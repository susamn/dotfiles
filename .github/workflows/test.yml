name: Scripts, aliases and configuration

on: [push, pull_request]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Bats suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      # NOT submodules: true. That fetches every submodule including
      # .config/_secured, which is private and aborts the whole checkout on a
      # runner. Only the two bats helpers are actually required.
      with:
        submodules: false

    - name: Fetch the bats helpers
      run: |
        git submodule update --init --depth 1 \
          workspace/tests/test_helper/bats-support \
          workspace/tests/test_helper/bats-assert

    - name: Fetch the skills submodule (optional)
      # Only the skill-reference cases need it, and they skip when it is absent,
      # so a private or unavailable submodule must not fail the suite.
      continue-on-error: true
      run: git submodule update --init --depth 1 workspace/aistuff

    - name: Install bats-core
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y bats
        bats --version

    - name: Run the suite
      # Directory discovery rather than named files, so a new .bats file is picked
      # up automatically instead of silently never running.
      run: bats workspace/tests

  units:
    name: Systemd unit files
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate every shipped unit
      # systemd-analyze catches malformed directives. Template units cannot be
      # verified without an instance name, so they are checked by instantiating
      # them against a throwaway name rather than being skipped outright.
      run: |
        rc=0
        for unit in workspace/services/*.service workspace/services/*.timer \
                    workspace/services/*.target; do
          [ -e "$unit" ] || continue
          case "$unit" in
            *@.service|*@.timer)
              inst="${unit%@.*}@ci.${unit##*.}"
              cp "$unit" "/tmp/$(basename "$inst")"
              if ! systemd-analyze verify "/tmp/$(basename "$inst")" 2>/tmp/err; then
                echo "::error file=$unit::$(cat /tmp/err)"; rc=1
              fi
              ;;
            *)
              if ! systemd-analyze verify "$unit" 2>/tmp/err; then
                echo "::error file=$unit::$(cat /tmp/err)"; rc=1
              fi
              ;;
          esac
        done
        exit $rc

    - name: Reject a WantedBy that cannot resolve in its own scope
      # multi-user.target does not exist in the user manager. A user unit wanting
      # it enables without error and then never activates -- quieter than a
      # failure, and the exact bug this repo has already shipped once.
      run: |
        rc=0
        for unit in .config/systemd/user/*.service .config/systemd/user/*.timer \
                    .config/systemd/user/*.target; do
          [ -e "$unit" ] || continue
          if grep -vE '^\s*[#;]' "$unit" | grep -qE '^WantedBy=.*multi-user\.target'; then
            echo "::error file=$unit::user-scope unit wants multi-user.target"
            rc=1
          fi
        done
        exit $rc
