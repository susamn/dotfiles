[project]
name = "op-vault-broker"
version = "1.0.0"
description = "Single-vault 1Password secret broker, reachable only over a local Unix socket."
requires-python = ">=3.11"
dependencies = [
    "onepassword-sdk>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/op_vault_broker"]
