[project]
name = "opvaultclient"
version = "1.0.0"
description = "Thin Unix-socket client for op-vault-broker. No 1Password dependency: the caller's OS identity is its authentication."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opvaultclient"]
